  severity_levels:
  - level: Critical
    definition: Complete platform outage or data breach
    response_working_hours: < 15 minutes
    response_outside_hours: < 30 minutes
  - level: Major
    definition: Partial degradation or limited-scope issue; core platform functional
    response_working_hours: < 1 business hour
    response_outside_hours: next business day
  - level: Minor
    definition: Low impact, no operational urgency
    response_working_hours: next business day
    response_outside_hours: next business day
  working_hours: 09:00-17:00 CET, Mon-Fri, excluding public holidays
  post_incident_review: conducted for Critical incidents
maintenance:
  notice: at least 48 hours in advance via designated contact channel
