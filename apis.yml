aid: enapi
name: Enapi
description: >-
  Enapi (ENAPI) operates a unified roaming and clearing platform for the electric
  vehicle charging industry, brokering transactions between Charge Point Operators
  (CPOs) and e-Mobility Service Providers (eMSPs). Rather than exposing a proprietary
  API, Enapi implements the open OCPI (Open Charge Point Interface) standard
  out-of-the-box across versions 2.1.1, 2.2.1, and 2.3.0, operating as an OCPI HUB
  that handles version interoperability, message routing, and endpoint fan-out on
  behalf of partners. Its three product lines are Roaming (peer-to-peer commercial
  connections while Enapi handles the technical integration), Technical (standardized
  OCPI onboarding with automated testing and a staging environment), and Financial
  CDR Clearing (real-time Charge Detail Record validation, dispute flagging, and
  settlement). As of early 2024 the platform connects over 700,000 charge points and
  works with most major eMSPs including partners such as TotalEnergies, ChargePoint,
  ubitricity, Plugsurfing, Monta, and Eneco.
