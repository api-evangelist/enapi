apis:
- name: Enapi OCPI Roaming API
  description: >-
    Enapi's OCPI HUB endpoint for EV charging roaming. Implements the Open Charge
    Point Interface (OCPI) 2.1.1 / 2.2.1 / 2.3.0 across the Credentials, Locations,
    Tariffs, Tokens, Sessions, CDRs, Commands, HubClientInfo, and Payments modules.
    Authentication is via OCPI token exchange (handshake) with tokens carried in the
    Authorization header (Base64-encoded for 2.2.1+).
